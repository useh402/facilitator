# gitleaks configuration: the default rules plus an allowlist for public on-chain addresses.
# A 40-hex EVM address is public by nature. 64-hex values (private keys) are never allowlisted.
[extend]
useDefault = true

[allowlist]
description = "public chain and token addresses"
regexes = ['''^0x[0-9a-fA-F]{40}$''', '''^permit2_body$''']  # the second is a test helper name, not a value
regexTarget = "secret"
