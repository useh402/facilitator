[project]
name = "humanapi-facilitator"
version = "0.1.0"
description = "HumanAPI x402 facilitator: USDG on Robinhood Chain (Permit2) and USDC on Solana (SVM exact)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "x402[evm,svm,extensions]==2.25.0",
  "web3>=7,<8",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2",
  "pydantic-settings>=2.3",
  "httpx>=0.28",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "pytest-timeout>=2", "ruff>=0.6"]

[project.scripts]
humanapi-facilitator = "humanapi_facilitator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["humanapi_facilitator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# the demo scripts import their sibling module; name it so import sorting is the same on every machine
known-first-party = ["humanapi_facilitator", "common"]
